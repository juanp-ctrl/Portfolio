allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: false
  sharp: true
  unrs-resolver: true

# Security floors for transitive deps. Use ranges (not exact pins) so they
# never pin a vulnerable version; remove an entry once the parent catches up.
overrides:
  sucrase: '^3.35.1' # drops glob -> minimatch -> brace-expansion (DoS advisories)
  source-map-js: '^1.2.2'
  'postcss-selector-parser@^6': '^6.1.5'
  'zod@^4': '^4.6.6'
  'ajv@^6': '^6.14.0'
  'fast-uri@^3': '^3.1.9'
  compression: '^1.8.2'
  'brace-expansion@^5': '^5.0.12'

minimumReleaseAge: 2880
